<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Intelligence System</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #7c6af7;
      --accent-dim: #4a3fa8;
      --text: #e2e4f0;
      --muted: #7a7f9a;
      --green: #3ecf8e;
      --yellow: #f59e0b;
      --red: #f87171;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header .pill {
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 0;
      height: calc(100vh - 65px);
    }

    main {
      padding: 2rem;
      overflow-y: auto;
      overflow-x: hidden;
      border-right: 1px solid var(--border);
    }

    /* ── Input tabs ── */
    .input-tabs {
      display: flex;
      gap: 0.25rem;
      margin-bottom: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.25rem;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      border-radius: 7px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.45rem 0.5rem;
      transition: background 0.15s, color 0.15s;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      background: var(--accent-dim);
      color: var(--accent);
    }

    /* ── Input panels ── */
    .input-panel { display: none; margin-bottom: 1.5rem; }
    .input-panel.active { display: block; }

    .query-box {
      display: flex;
      gap: 0.75rem;
    }

    .query-box input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .query-box input:focus { border-color: var(--accent); }
    .query-box input::placeholder { color: var(--muted); }

    .query-box button {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      transition: background 0.2s, opacity 0.2s;
    }

    .query-box button:hover { background: var(--accent-dim); }
    .query-box button:disabled { opacity: 0.5; cursor: not-allowed; }

    .ingest-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .ingest-row input[type="text"] {
      flex: 1;
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.92rem;
      padding: 0.6rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .ingest-row input[type="text"]:focus { border-color: var(--accent); }
    .ingest-row input[type="text"]::placeholder { color: var(--muted); }

    .ingest-row input[type="file"] { display: none; }

    .file-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.6rem 1rem;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .file-label:hover { background: var(--border); }
    .file-label.has-file { border-color: var(--accent); color: var(--accent); }

    .ingest-btn {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 10px;
      color: var(--accent);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.6rem 1.1rem;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .ingest-btn:hover { background: var(--accent-dim); color: #fff; }
    .ingest-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Spinner ── */
    .spinner {
      display: none;
      align-items: center;
      gap: 0.75rem;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .spinner.active { display: flex; }

    .spinner-dots {
      display: flex;
      gap: 4px;
    }

    .spinner-dot {
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .spinner-dot:nth-child(2) { animation-delay: 0.2s; }
    .spinner-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { transform: scale(0.7); opacity: 0.4; }
      50% { transform: scale(1); opacity: 1; }
    }

    #spinnerLabel { transition: opacity 0.3s; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .score-badge {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
    }

    .score-high { background: rgba(62,207,142,0.15); color: var(--green); }
    .score-mid  { background: rgba(245,158,11,0.15); color: var(--yellow); }
    .score-low  { background: rgba(248,113,113,0.15); color: var(--red); }

    /* ── Markdown answer ── */
    .answer-text {
      line-height: 1.75;
      font-size: 0.97rem;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .answer-text h1,
    .answer-text h2,
    .answer-text h3 {
      margin: 1.1rem 0 0.45rem;
      font-size: 1rem;
      color: var(--accent);
    }

    .answer-text h1 { font-size: 1.1rem; }

    .answer-text p { margin-bottom: 0.65rem; }

    .answer-text ul,
    .answer-text ol {
      padding-left: 1.4rem;
      margin-bottom: 0.65rem;
    }

    .answer-text li { margin-bottom: 0.25rem; }

    .answer-text strong { color: var(--text); font-weight: 600; }

    .answer-text code {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.88em;
      padding: 0.1em 0.35em;
    }

    .answer-text pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }

    .answer-text pre code {
      background: none;
      border: none;
      padding: 0;
    }

    .answer-text blockquote {
      border-left: 3px solid var(--accent);
      color: var(--muted);
      margin: 0.5rem 0;
      padding: 0.25rem 0.75rem;
    }

    .answer-text a { color: var(--accent); }

    .answer-text hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1rem 0;
    }

    /* ── Trace ── */
    details { margin-bottom: 0.5rem; }

    details summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      background: var(--bg);
      font-size: 0.85rem;
      font-weight: 500;
      user-select: none;
      transition: background 0.15s;
    }

    details summary:hover { background: var(--border); }
    details summary::before { content: '▶'; font-size: 0.6rem; color: var(--accent); transition: transform 0.2s; }
    details[open] summary::before { transform: rotate(90deg); }

    .trace-body {
      padding: 0.75rem 1rem;
      font-size: 0.83rem;
      color: var(--muted);
      line-height: 1.6;
      border-left: 2px solid var(--border);
      margin: 0.25rem 0 0.25rem 0.75rem;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .trace-files { margin-top: 0.4rem; }
    .trace-files span {
      display: inline-block;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.75rem;
      padding: 0.1rem 0.4rem;
      margin: 0.15rem 0.15rem 0 0;
      color: var(--muted);
    }

    /* ── Sidebar ── */
    aside {
      padding: 1.5rem;
      overflow-y: auto;
    }

    aside h2 {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .note-item {
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 0.25rem;
    }

    .note-item:hover { background: var(--surface); }

    .note-item .note-title {
      font-size: 0.88rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-item .note-date {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 90%;
      max-width: 700px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 { font-size: 0.95rem; font-weight: 600; }

    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
    }

    .modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      font-size: 0.85rem;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-word;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      color: var(--muted);
    }

    /* ── New Research button ── */
    .new-research-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      margin-bottom: 1.25rem;
      transition: border-color 0.15s, color 0.15s;
    }
    .new-research-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Placeholder ── */
    #placeholder {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }

    #placeholder h2 {
      font-size: 1.4rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    #placeholder p { font-size: 0.9rem; }

    .example-prompt {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.45rem 0.85rem;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .example-prompt:hover {
      background: var(--border);
      color: var(--text);
      border-color: var(--accent);
    }

    /* ── Sidebar toggle (mobile) ── */
    .sidebar-toggle {
      display: none;
      margin-left: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.4rem 0.75rem;
      transition: background 0.15s;
    }
    .sidebar-toggle:hover { background: var(--border); }

    /* ── Tablet ── */
    @media (max-width: 1023px) {
      header { padding: 1rem 1.25rem; }
      .sidebar-toggle { display: inline-block; }

      .layout {
        grid-template-columns: 1fr;
        height: auto;
        min-height: calc(100vh - 57px);
      }

      main {
        padding: 1.5rem;
        border-right: none;
      }

      aside {
        border-top: 1px solid var(--border);
        max-height: 0;
        overflow: hidden;
        padding: 0 1.5rem;
        transition: max-height 0.3s ease, padding 0.3s ease;
      }
      aside.open {
        max-height: 400px;
        padding: 1.25rem 1.5rem;
        overflow-y: auto;
      }
    }

    /* ── Mobile ── */
    @media (max-width: 639px) {
      header { padding: 0.75rem 1rem; }

      main {
        padding: 1rem;
        overflow-y: unset;
      }

      .card { padding: 1rem; }
      #placeholder { padding: 2rem 1rem; }

      .modal {
        width: 95%;
        max-height: 90vh;
        border-radius: 10px;
      }
      .modal-header { padding: 0.75rem 1rem; }
      .modal-body { padding: 1rem; }

      .tab-btn { font-size: 0.72rem; padding: 0.4rem 0.3rem; }
    }

    @media (max-width: 400px) {
      .ingest-row { flex-direction: column; }
      .ingest-btn, .ingest-row input[type="text"] { width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <h1>Research Intelligence System</h1>
  <span class="pill">7 Agents</span>
  <span class="pill" id="providerBadge" style="background:rgba(62,207,142,0.15);color:var(--green);display:none;"></span>
  <a href="/architecture.html" style="margin-left:auto;margin-right:0.5rem;font-size:0.78rem;color:var(--muted);text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:0.3rem 0.65rem;transition:color 0.15s;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted)'">Architecture ↗</a>
  <button class="sidebar-toggle" onclick="toggleSidebar()">☰ Notes</button>
</header>

<div class="layout">
  <main>

    <!-- Tab strip -->
    <div class="input-tabs">
      <button class="tab-btn active" onclick="switchTab('text')">✎ Text</button>
      <button class="tab-btn" onclick="switchTab('url')">🔗 URL</button>
      <button class="tab-btn" onclick="switchTab('pdf')">📄 PDF</button>
      <button class="tab-btn" onclick="switchTab('image')">🖼 Image</button>
      <button class="tab-btn" onclick="switchTab('csv')">📊 CSV / JSON</button>
    </div>

    <!-- Text panel -->
    <div class="input-panel active" id="panel-text">
      <div class="query-box">
        <input id="queryInput" type="text" placeholder="Ask anything... e.g. What are transformer models?" />
        <button id="submitBtn" onclick="submitQuery()">Ask</button>
      </div>
    </div>

    <!-- URL panel -->
    <div class="input-panel" id="panel-url">
      <div class="ingest-row">
        <input type="text" id="urlInput" placeholder="https://example.com/article" />
        <button class="ingest-btn" id="urlBtn" onclick="ingestUrl()">Ingest URL</button>
      </div>
    </div>

    <!-- PDF panel -->
    <div class="input-panel" id="panel-pdf">
      <div class="ingest-row">
        <label class="file-label" id="fileLabel" for="pdfInput">📄 Choose PDF</label>
        <input type="file" id="pdfInput" accept=".pdf" onchange="onPdfSelected()" />
        <button class="ingest-btn" id="pdfBtn" onclick="ingestPdf()" disabled>Ingest PDF</button>
      </div>
    </div>

    <!-- Image panel -->
    <div class="input-panel" id="panel-image">
      <div class="ingest-row">
        <label class="file-label" id="imageLabel" for="imageInput">🖼 Choose Image</label>
        <input type="file" id="imageInput" accept=".jpg,.jpeg,.png,.webp" onchange="onImageSelected()" />
        <button class="ingest-btn" id="imageBtn" onclick="ingestImage()" disabled>Ingest Image</button>
      </div>
    </div>

    <!-- CSV / JSON panel -->
    <div class="input-panel" id="panel-csv">
      <div class="ingest-row">
        <label class="file-label" id="csvLabel" for="csvInput">📊 Choose CSV or JSON</label>
        <input type="file" id="csvInput" accept=".csv,.json" onchange="onCsvSelected()" />
        <button class="ingest-btn" id="csvBtn" onclick="ingestCsv()" disabled>Ingest Data</button>
      </div>
    </div>

    <!-- Spinner -->
    <div class="spinner" id="spinner">
      <div class="spinner-dots">
        <div class="spinner-dot"></div>
        <div class="spinner-dot"></div>
        <div class="spinner-dot"></div>
      </div>
      <span id="spinnerLabel">Intake Agent running...</span>
    </div>

    <div id="results">
      <div id="placeholder">
        <h2>Turn any input into structured knowledge.</h2>
        <p>Drop in a text query, PDF, image, URL, or CSV — 7 agents research,<br>reason, write, link, and validate the result automatically.</p>
        <div style="margin-top:1.5rem;display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center;">
          <button class="example-prompt" onclick="useExample(this)">What is retrieval augmented generation?</button>
          <button class="example-prompt" onclick="useExample(this)">Explain the transformer attention mechanism</button>
          <button class="example-prompt" onclick="useExample(this)">How does semantic search work?</button>
        </div>
      </div>
    </div>
  </main>

  <aside>
    <h2>Knowledge Base</h2>
    <div id="notesList"></div>
  </aside>
</div>

<!-- Note Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Note</h3>
      <button class="modal-close" onclick="document.getElementById('modalOverlay').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
  // ── Tab switching ──────────────────────────────────────────────────────────

  const TABS = ['text', 'url', 'pdf', 'image', 'csv'];

  function switchTab(name) {
    TABS.forEach(t => {
      document.getElementById('panel-' + t).classList.toggle('active', t === name);
    });
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
      btn.classList.toggle('active', TABS[i] === name);
    });
  }

  // ── Agent spinner cycle ────────────────────────────────────────────────────

  const AGENT_STEPS = [
    'Intake Agent running...',
    'Extraction Agent running...',
    'Research Agent running...',
    'Reasoning Agent running...',
    'Action Agent running...',
    'Linker Agent running...',
    'Validator Agent running...',
  ];

  let _spinnerTimer = null;

  function startSpinnerCycle() {
    let step = 0;
    const label = document.getElementById('spinnerLabel');
    label.textContent = AGENT_STEPS[0];
    // Advance label every ~2.5s so the full cycle covers ~17.5s
    _spinnerTimer = setInterval(() => {
      step = (step + 1) % AGENT_STEPS.length;
      label.style.opacity = '0';
      setTimeout(() => {
        label.textContent = AGENT_STEPS[step];
        label.style.opacity = '1';
      }, 200);
    }, 2500);
  }

  function stopSpinnerCycle() {
    clearInterval(_spinnerTimer);
    _spinnerTimer = null;
    document.getElementById('spinnerLabel').textContent = AGENT_STEPS[0];
    document.getElementById('spinnerLabel').style.opacity = '1';
  }

  // ── Loading state ──────────────────────────────────────────────────────────

  function setLoading(loading) {
    const spinner = document.getElementById('spinner');
    document.getElementById('submitBtn').disabled = loading;
    document.getElementById('urlBtn').disabled = loading;
    document.getElementById('pdfBtn').disabled = loading || !document.getElementById('pdfInput').files.length;
    document.getElementById('imageBtn').disabled = loading || !document.getElementById('imageInput').files.length;
    document.getElementById('csvBtn').disabled = loading || !document.getElementById('csvInput').files.length;

    if (loading) {
      spinner.classList.add('active');
      startSpinnerCycle();
      document.getElementById('results').innerHTML = '';
    } else {
      spinner.classList.remove('active');
      stopSpinnerCycle();
    }
  }

  // ── Marked config ──────────────────────────────────────────────────────────

  marked.setOptions({ breaks: true, gfm: true });

  // ── Render results ─────────────────────────────────────────────────────────

  const INPUT_TYPE_LABELS = {
    text_query:  { label: 'Text Query',  icon: '✎' },
    document:    { label: 'Document',    icon: '📄' },
    url_content: { label: 'URL Content', icon: '🔗' },
  };

  function renderResults(data) {
    // Strip SSE event type field if present
    const { type: _type, ...payload } = data;
    data = payload;
    const results = document.getElementById('results');

    const scoreClass = data.validation.score >= 8 ? 'score-high'
                     : data.validation.score >= 5 ? 'score-mid' : 'score-low';

    const typeInfo = INPUT_TYPE_LABELS[data.input_type] || { label: data.input_type, icon: '◈' };
    const typeBadge = `<span style="font-size:0.75rem;font-weight:600;padding:0.2rem 0.6rem;border-radius:999px;background:rgba(124,106,247,0.15);color:var(--accent);margin-right:0.5rem;">${typeInfo.icon} ${typeInfo.label}</span>`;

    let notesHtml = '';
    if (data.notes_created.length) {
      notesHtml += `<span style="color:var(--green)">✦ Created: ${data.notes_created.join(', ')}</span><br>`;
    }
    if (data.notes_updated.length) {
      notesHtml += `<span style="color:var(--yellow)">↻ Updated: ${data.notes_updated.join(', ')}</span>`;
    }

    let issuesHtml = '';
    if (data.validation.issues.length) {
      issuesHtml = `<div style="margin-top:0.75rem;font-size:0.8rem;color:var(--muted)">
        Issues: ${data.validation.issues.join(' · ')}
      </div>`;
    }

    let traceHtml = data.agent_trace.map(t => {
      const filesRead = t.files_read?.length
        ? `<div class="trace-files"><strong>Read:</strong> ${t.files_read.map(f => `<span>${f}</span>`).join('')}</div>` : '';
      const filesWritten = t.files_written?.length
        ? `<div class="trace-files"><strong>Wrote:</strong> ${t.files_written.map(f => `<span>${f}</span>`).join('')}</div>` : '';
      const errFlag = t.error ? ' ⚠' : '';
      return `
        <details>
          <summary>${t.agent}${errFlag}</summary>
          <div class="trace-body">
            ${t.action}
            ${filesRead}${filesWritten}
          </div>
        </details>`;
    }).join('');

    // Render answer as markdown
    const answerHtml = marked.parse(data.answer || '');

    results.innerHTML = `
      <button class="new-research-btn" onclick="newResearch()">← New Research</button>
      <div class="card">
        <div class="card-header">
          <span class="card-title">Answer</span>
          <span>${typeBadge}<span class="score-badge ${scoreClass}">Quality ${data.validation.score}/10</span></span>
        </div>
        <div class="answer-text">${answerHtml}</div>
        ${notesHtml ? `<div style="margin-top:1rem;font-size:0.8rem;">${notesHtml}</div>` : ''}
        ${issuesHtml}
      </div>

      <div class="card">
        <div class="card-header"><span class="card-title">Agent Trace</span></div>
        ${traceHtml}
      </div>
    `;
  }

  // ── Streaming query ────────────────────────────────────────────────────────

  async function submitQuery() {
    const query = document.getElementById('queryInput').value.trim();
    if (!query) return;
    setLoading(true);

    // Prepare a card that will fill in as tokens arrive
    const results = document.getElementById('results');
    results.innerHTML = `
      <div class="card" id="streamCard">
        <div class="card-header">
          <span class="card-title">Answer</span>
          <span id="streamBadge" style="font-size:0.75rem;color:var(--muted);">streaming...</span>
        </div>
        <div class="answer-text" id="streamAnswer"></div>
      </div>`;

    let fullAnswer = '';
    let buffer = '';
    let renderTimer = null;

    // Throttle DOM updates to every 50ms to avoid layout thrash
    function flushBuffer() {
      if (!buffer) return;
      fullAnswer += buffer;
      buffer = '';
      document.getElementById('streamAnswer').innerHTML = marked.parse(fullAnswer);
    }

    try {
      const res = await fetch('/api/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query }),
      });
      if (!res.ok) throw new Error(`Server error: ${res.status}`);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      renderTimer = setInterval(flushBuffer, 50);

      let remainder = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = remainder + decoder.decode(value, { stream: true });
        const lines = chunk.split('\n');
        remainder = lines.pop(); // last line may be incomplete

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let event;
          try { event = JSON.parse(line.slice(6)); } catch { continue; }

          if (event.type === 'token') {
            buffer += event.text;
          } else if (event.type === 'agent') {
            document.getElementById('spinnerLabel').style.opacity = '0';
            setTimeout(() => {
              const label = document.getElementById('spinnerLabel');
              if (label) { label.textContent = event.name + ' running...'; label.style.opacity = '1'; }
            }, 200);
          } else if (event.type === 'done') {
            flushBuffer();
            clearInterval(renderTimer);
            renderResults(event);
            loadNotes();
            setLoading(false);
            return;
          } else if (event.type === 'error') {
            throw new Error(event.message);
          }
        }
      }
      flushBuffer();
    } catch (err) {
      clearInterval(renderTimer);
      results.innerHTML =
        `<div class="card"><p style="color:var(--red)">Error: ${err.message}</p></div>`;
    } finally {
      setLoading(false);
    }
  }

  // ── URL ingest ─────────────────────────────────────────────────────────────

  async function ingestUrl() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) return;
    setLoading(true);
    try {
      const res = await fetch('/api/ingest/url', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      if (!res.ok) { const err = await res.json(); throw new Error(err.detail || `Server error: ${res.status}`); }
      renderResults(await res.json());
      loadNotes();
    } catch (err) {
      document.getElementById('results').innerHTML =
        `<div class="card"><p style="color:var(--red)">Error: ${err.message}</p></div>`;
    } finally { setLoading(false); }
  }

  // ── PDF ingest ─────────────────────────────────────────────────────────────

  function onPdfSelected() {
    const input = document.getElementById('pdfInput');
    const label = document.getElementById('fileLabel');
    const btn   = document.getElementById('pdfBtn');
    if (input.files.length) {
      label.textContent = '📄 ' + input.files[0].name;
      label.classList.add('has-file');
      btn.disabled = false;
    } else {
      label.textContent = '📄 Choose PDF';
      label.classList.remove('has-file');
      btn.disabled = true;
    }
  }

  async function ingestPdf() {
    const input = document.getElementById('pdfInput');
    if (!input.files.length) return;
    setLoading(true);
    const form = new FormData();
    form.append('file', input.files[0]);
    try {
      const res = await fetch('/api/ingest/pdf', { method: 'POST', body: form });
      if (!res.ok) { const err = await res.json(); throw new Error(err.detail || `Server error: ${res.status}`); }
      renderResults(await res.json());
      resetInputs();
      loadNotes();
    } catch (err) {
      document.getElementById('results').innerHTML =
        `<div class="card"><p style="color:var(--red)">Error: ${err.message}</p></div>`;
    } finally { setLoading(false); }
  }

  // ── Notes sidebar ──────────────────────────────────────────────────────────

  async function loadNotes() {
    const list = document.getElementById('notesList');
    try {
      const res = await fetch('/api/notes');
      const notes = await res.json();
      list.innerHTML = notes.map(n => `
        <div class="note-item" onclick="openNote('${n.filename}', '${n.title.replace(/'/g, "\\'")}')">
          <div class="note-title">${n.title}</div>
          <div class="note-date">${n.last_updated}</div>
        </div>
      `).join('');
    } catch {
      list.innerHTML = '<p style="font-size:0.8rem;color:var(--muted)">Could not load notes.</p>';
    }
  }

  async function openNote(filename, title) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').textContent = 'Loading...';
    document.getElementById('modalOverlay').classList.add('open');
    const res = await fetch(`/api/notes/${filename}`);
    const data = await res.json();
    document.getElementById('modalBody').textContent = data.content;
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modalOverlay')) {
      document.getElementById('modalOverlay').classList.remove('open');
    }
  }

  function toggleSidebar() {
    document.querySelector('aside').classList.toggle('open');
  }

  function useExample(btn) {
    switchTab('text');
    document.getElementById('queryInput').value = btn.textContent;
    document.getElementById('queryInput').focus();
  }

  // ── Provider badge ─────────────────────────────────────────────────────────

  async function loadProvider() {
    try {
      const res = await fetch('/api/provider');
      const data = await res.json();
      const badge = document.getElementById('providerBadge');
      badge.textContent = data.provider;
      badge.style.display = 'inline-block';
    } catch {}
  }

  // ── Reset inputs ──────────────────────────────────────────────────────────

  function resetInputs() {
    // Clear file inputs and reset their labels
    const files = [
      { input: 'pdfInput',   label: 'fileLabel',  btn: 'pdfBtn',   default: '📄 Choose PDF' },
      { input: 'imageInput', label: 'imageLabel', btn: 'imageBtn', default: '🖼 Choose Image' },
      { input: 'csvInput',   label: 'csvLabel',   btn: 'csvBtn',   default: '📊 Choose CSV or JSON' },
    ];
    files.forEach(({ input, label, btn, default: text }) => {
      document.getElementById(input).value = '';
      const lbl = document.getElementById(label);
      lbl.textContent = text;
      lbl.classList.remove('has-file');
      document.getElementById(btn).disabled = true;
    });
    // Clear URL and text inputs
    document.getElementById('urlInput').value = '';
  }

  // ── New Research ───────────────────────────────────────────────────────────

  function newResearch() {
    resetInputs();
    document.getElementById('queryInput').value = '';
    document.getElementById('results').innerHTML = `
      <div id="placeholder">
        <h2>Turn any input into structured knowledge.</h2>
        <p>Drop in a text query, PDF, image, URL, or CSV — 7 agents research,<br>reason, write, link, and validate the result automatically.</p>
        <div style="margin-top:1.5rem;display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center;">
          <button class="example-prompt" onclick="useExample(this)">What is retrieval augmented generation?</button>
          <button class="example-prompt" onclick="useExample(this)">Explain the transformer attention mechanism</button>
          <button class="example-prompt" onclick="useExample(this)">How does semantic search work?</button>
        </div>
      </div>`;
    switchTab('text');
    document.getElementById('queryInput').focus();
  }

  // ── Keyboard shortcuts ─────────────────────────────────────────────────────

  document.getElementById('queryInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitQuery();
  });
  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') ingestUrl();
  });

  loadNotes();
  loadProvider();
</script>
